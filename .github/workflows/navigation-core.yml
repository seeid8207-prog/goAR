name: GoAR CI

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "server/**"
      - "app.json"
      - "package.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
  push:
    branches: [main]

jobs:
  core-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:navigation
      - run: npm run test:server
      - run: npm run typecheck
