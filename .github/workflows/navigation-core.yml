name: Navigation core

on:
  pull_request:
    paths:
      - "src/lib/**"
      - "src/types/**"
      - "tsconfig.navtest.json"
      - "package.json"
  push:
    branches: [main]

jobs:
  navigation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:navigation
