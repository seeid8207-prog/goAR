services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: goar
      POSTGRES_USER: goar
      POSTGRES_PASSWORD: goar
    ports:
      - "5432:5432"
    volumes:
      - goar_pg:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  goar_pg:
